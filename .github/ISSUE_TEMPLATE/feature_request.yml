name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Hosting considerations
      description: The project must keep working on ordinary PHP shared hosting without Composer, Node, Docker or cron. Does your idea need anything beyond that?
